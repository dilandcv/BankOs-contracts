  /api/v1/user/banks:
    get:
      tags:
      - bank-link-controller
      operationId: getLinkedBanks
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListLinkedBankResponse"
  /api/v1/transactions:
    get:
      tags:
      - transaction-controller
      operationId: history
      parameters:
      - name: accountId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseTransactionResponse"
  /api/v1/transactions/{id}:
    get:
      tags:
      - transaction-controller
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTransactionResponse"
  /api/v1/tenants/{id}:
    get:
      tags:
