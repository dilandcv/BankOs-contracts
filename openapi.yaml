openapi: 3.1.0
info:
  title: BankOS API
  description: Backend multi-banco de BankOS. Un login por institución (tenant).
  contact:
    name: BankOS
  version: v1
servers:
- url: http://localhost:8080
  description: Local Development Server
security:
- bearerAuth: []
paths:
  /api/v1/settings:
    get:
      tags:
      - settings-controller
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTenantSettingsResponse"
    put:
      tags:
      - settings-controller
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTenantSettingsResponse"
  /api/v1/webhooks:
