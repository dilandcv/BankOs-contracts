  /api/v1/banks/available:
    get:
      tags:
      - bank-link-controller
      operationId: getAvailableBanks
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListAvailableBankResponse"
  /api/v1/auth/me:
    get:
      tags:
      - auth-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
