      operationId: unlinkBank
      parameters:
      - name: linkId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
components:
  schemas:
    UpdateSettingsRequest:
      type: object
      properties:
        settings:
          type: object
          additionalProperties:
            type: string
      required:
      - settings
    ApiResponseTenantSettingsResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/TenantSettingsResponse"
        correlationId:
          type: string
    TenantSettingsResponse:
      type: object
      properties:
        settings:
          type: object
          additionalProperties:
            type: string
    CreateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          maxLength: 500
          minLength: 0
        events:
          type: string
          maxLength: 500
          minLength: 0
        secret:
          type: string
          maxLength: 255
          minLength: 16
      required:
      - events
      - secret
      - url
    ApiResponseWebhookResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/WebhookResponse"
        correlationId:
          type: string
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        events:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          minLength: 0
        fullName:
          type: string
          maxLength: 150
          minLength: 0
        password:
          type: string
          maxLength: 100
          minLength: 8
        role:
          type: string
          enum:
          - PLATFORM_ADMIN
          - TENANT_ADMIN
          - OPERATOR
          - AUDITOR
      required:
      - email
      - fullName
      - password
      - role
    ApiResponseUserResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/UserResponse"
        correlationId:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - PLATFORM_ADMIN
          - TENANT_ADMIN
          - OPERATOR
          - AUDITOR
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    ApiResponseLinkedBankResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/LinkedBankResponse"
        correlationId:
          type: string
    LinkedBankResponse:
      type: object
      properties:
        linkId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        tenantCode:
          type: string
        tenantName:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        logoUrl:
          type: string
        accountNickname:
          type: string
        accountNumberMask:
          type: string
        accountType:
          type: string
        authStatus:
          type: string
        authMechanism:
          type: string
        isDefault:
          type: boolean
        lastSyncAt:
          type: string
          format: date-time
    WithdrawalRequest:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.0001
        currency:
          type: string
          minLength: 1
          pattern: "[A-Za-z]{3}"
        description:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - accountId
      - amount
      - currency
    ApiResponseTransactionResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/TransactionResponse"
        correlationId:
          type: string
    TransactionEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        direction:
          type: string
        amount:
          type: number
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        amount:
          type: number
        currency:
          type: string
        fee:
          type: number
        exchangeRate:
          type: number
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        description:
          type: string
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TransactionEntryResponse"
    TransferRequest:
      type: object
      properties:
        sourceAccountId:
          type: string
          format: uuid
        targetAccountId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.0001
        currency:
          type: string
          minLength: 1
          pattern: "[A-Za-z]{3}"
        description:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - amount
      - currency
      - sourceAccountId
      - targetAccountId
    TransferPreviewRequest:
      type: object
      properties:
        sourceAccountId:
          type: string
          format: uuid
        targetAccountId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.0001
        currency:
          type: string
          minLength: 1
          pattern: "[A-Za-z]{3}"
      required:
      - amount
      - currency
      - sourceAccountId
      - targetAccountId
    ApiResponseTransferPreviewResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/TransferPreviewResponse"
        correlationId:
          type: string
    TransferPreviewResponse:
      type: object
      properties:
        sourceAccountId:
          type: string
          format: uuid
        targetAccountId:
          type: string
          format: uuid
        amount:
          type: number
        sourceCurrency:
          type: string
        targetCurrency:
          type: string
        exchangeRate:
          type: number
        fee:
          type: number
        debitAmount:
          type: number
        creditAmount:
          type: number
    DepositRequest:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.0001
        currency:
          type: string
          minLength: 1
          pattern: "[A-Za-z]{3}"
        description:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - accountId
      - amount
      - currency
    CreateTenantRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          minLength: 0
          pattern: "[A-Za-z0-9_]+"
        name:
          type: string
          maxLength: 150
          minLength: 0
        primaryColor:
          type: string
          pattern: "^#([A-Fa-f0-9]{6})$"
        secondaryColor:
          type: string
          pattern: "^#([A-Fa-f0-9]{6})$"
        logoUrl:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - code
      - name
    ApiResponseTenantResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/TenantResponse"
        correlationId:
          type: string
    TenantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        logoUrl:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateExchangeRateRequest:
      type: object
      properties:
        fromCurrency:
          type: string
          minLength: 1
          pattern: "[A-Za-z]{3}"
        toCurrency:
          type: string
          minLength: 1
          pattern: "[A-Za-z]{3}"
        rate:
          type: number
          minimum: 0.00000001
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
      required:
      - effectiveFrom
      - fromCurrency
      - rate
      - toCurrency
    ApiResponseExchangeRateResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/ExchangeRateResponse"
        correlationId:
          type: string
    ExchangeRateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fromCurrency:
